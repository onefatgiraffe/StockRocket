{% if page.tagline %}{% assign page_title = site.title | append: " – " | append: page.tagline %}{% else %}{% assign page_title = page.title | append: " – " | append: site.title %}{% endif %}{% assign page_desc = page.description | default: site.description %}<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<meta name="description" content="{{ page_desc }}">
<meta name="theme-color" content="#000000">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_desc }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/screenshots/01.png' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ '/assets/icon.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
